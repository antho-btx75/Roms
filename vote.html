<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question pour mon Roms</title>
    <style>
        body { 
            background: #0a0c12; 
            color: #c9d1d9; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            text-align: center; 
            padding: 60px 20px; 
            margin: 0;
        }
        .card { 
            max-width: 580px; 
            margin: 0 auto; 
            background: #111827; 
            padding: 50px 30px; 
            border-radius: 24px; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.5); 
        }
        h2 { 
            color: #fcf6ba; 
            margin-bottom: 15px; 
        }
        p.intro { 
            margin: 25px 0 40px 0; 
            font-size: 1.15rem; 
            line-height: 1.65; 
        }
        .subtitle {
            color: #ff80df;
            margin: 30px 0 15px 0;
            font-size: 1.1rem;
            font-weight: 600;
        }
        button { 
            margin: 9px auto; 
            padding: 18px 24px; 
            font-size: 1.03rem; 
            border: none; 
            border-radius: 16px; 
            cursor: pointer; 
            background: linear-gradient(135deg, #3b82f6, #1e40af); 
            color: white; 
            width: 100%; 
            max-width: 480px; 
            display: block; 
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
        }
        button:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5);
        }
        .thanks { 
            margin-top: 45px; 
            font-size: 1.25rem; 
            color: #fcf6ba; 
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Question pour toi mon Roms</h2>
    <p class="intro">
        Sur la page Github, qu'est-ce que tu ressens vraiment ?<br>
        <span style="color: #ff80df;">Tu peux te lâcher librement, sans filtre. Tout reste ultra scred entre nous.</span>
    </p>

    <button onclick="sendVote(1)">1 - Je kiffes de fou et j'ai envie que tu te lâches un peu plus avec moi IRL</button>
    
    <button onclick="sendVote(2)">2 - Je kiffes mais ça me convient comme ça. On reste comme on est et on consomme ça en scred.</button>
    
    <div class="subtitle">Sous-questions pour le choix 2 :</div>
    
    <button onclick="sendVote(3)">3 - Tout est parfaitement équilibré</button>
    <button onclick="sendVote(4)">4 - Je voudrais le moins de cul, plus de sentiments</button>
    <button onclick="sendVote(5)">5 - Je voudrais le plus de cul, moins de sentiments</button>

    <div class="subtitle">Sous-propositions pour le choix 5 (orientation sexuelle) :</div>
    
    <button onclick="sendVote(6)">6 - J'aimerais que le contenu sex soit orienté Antho top 🍆 moi bottom 🍑</button>
    <button onclick="sendVote(7)">7 - J'aimerais que le contenu sex soit orienté Antho bottom 🍑 moi top 🍆</button>

    <button onclick="sendVote(8)">8 - Je n'aime pas trop la page Github car je suis pas dans ces bails là, je suis full hétéro</button>
    <button onclick="sendVote(9)">9 - Je kiffes ça, c'est mes bails, mais je t'aime pas.</button>
    <button onclick="sendVote(10)">10 - Je kiffes ça, c'est mes bails, mais j'aime un autre gars.</button>
    <button onclick="sendVote(11)">11 - Je suis un peu perdu. Je pense que je kiffe ça mais j'ai du mal avec tout ça.</button>

    <div id="status" class="thanks"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
    const firebaseConfig = {
        databaseURL: "https://roms-vote-default-rtdb.europe-west1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function sendVote(choice) {
        const statusEl = document.getElementById('status');
        statusEl.innerHTML = "Envoi en cours...";
        
        db.ref('reponse').set(choice).then(() => {
            statusEl.innerHTML = `Merci mon Roms !<br>Ta réponse (${choice}) a bien été enregistrée.`;
        }).catch(() => {
            statusEl.innerHTML = "Erreur lors de l'envoi...";
        });
    }
</script>

</body>
</html>
