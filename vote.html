<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question pour mon Roms</title>
    <style>
        body { 
            background: #0a0c12; 
            color: #c9d1d9; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            text-align: center; 
            padding: 60px 20px; 
        }
        .card { 
            max-width: 560px; 
            margin: 0 auto; 
            background: #111827; 
            padding: 50px; 
            border-radius: 24px; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.5); 
        }
        h2 { 
            color: #fcf6ba; 
            margin-bottom: 25px; 
            font-size: 1.6rem;
        }
        p.intro { 
            margin: 25px 0 35px 0; 
            font-size: 1.12rem; 
            line-height: 1.6; 
        }
        button { 
            margin: 10px auto; 
            padding: 18px 24px; 
            font-size: 1.05rem; 
            border: none; 
            border-radius: 16px; 
            cursor: pointer; 
            background: linear-gradient(135deg, #3b82f6, #1e40af); 
            color: white; 
            width: 100%; 
            max-width: 460px; 
            display: block; 
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3);
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(59, 130, 246, 0.5);
        }
        .thanks { 
            margin-top: 40px; 
            font-size: 1.25rem; 
            color: #fcf6ba; 
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Question pour toi mon Roms</h2>
    <p class="intro">
        Sur la page Github, qu'est-ce que tu ressens vraiment ?<br>
        <span style="color: #ff80df; font-weight: 600;">Tu peux te lâcher librement, sans filtre.</span>
    </p>

    <button onclick="sendVote(1)">1 - Tu kiffes de fou et t'as envie que je me lâche un peu plus avec toi IRL</button>
    <button onclick="sendVote(2)">2 - Tu kiffes mais ça te convient comme ça. On reste comme on est et on consomme ça en scred.</button>
    <button onclick="sendVote(3)">3 - Tu voudrais moins l'aspect sentimental et amoureux mais le côté cul c'est ok</button>
    <button onclick="sendVote(4)">4 - Tu voudrais moins le côté cul mais l'aspect sentimental c'est ok</button>
    <button onclick="sendVote(5)">5 - T'aimes pas trop la page Github car t'es pas dans ces bails là t'es full hétéro</button>

    <div id="status" class="thanks"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
    const firebaseConfig = {
        databaseURL: "https://roms-vote-default-rtdb.europe-west1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function sendVote(choice) {
        document.getElementById('status').innerHTML = "Envoi en cours...";
        db.ref('reponse').set(choice).then(() => {
            document.getElementById('status').innerHTML = `Merci mon Roms !<br>Ta réponse (${choice}) a bien été enregistrée.`;
        });
    }
</script>

</body>
</html>
