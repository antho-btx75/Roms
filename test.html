<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST LAB - ROMS SANCTUAIRE</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #0d1117;
            --text-main: #e6edf3;
            --gold-main: #bf953f;
            --gold-light: #fcf6ba;
            --gold-dark: #aa771c;
            --accent-blue: #58a6ff;
            --card-bg: #161b22;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-dark);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 800px; }
        
        h2 { 
            text-align: center; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            color: var(--gold-light);
            border-bottom: 2px solid var(--gold-main);
            padding-bottom: 10px;
            margin-top: 50px;
        }

        /* STYLE COMMUN DES BOITES */
        .section-box {
            background: #000;
            border: 2px solid var(--gold-main);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* GRID POUR LE CINÉ */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 10px;
            border: 1px solid var(--gold-dark);
            text-align: center;
        }

        iframe { border-radius: 10px; width: 100%; }

        /* BOUTONS */
        .btn-gold {
            cursor: pointer;
            background: #000;
            color: var(--gold-light);
            border: 1px solid var(--gold-main);
            padding: 10px 15px;
            border-radius: 8px;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn-gold:hover { background: var(--gold-main); color: #000; }
    </style>
</head>
<body>

<div class="container">

    <h1 style="text-align: center; color: var(--gold-main);">🧪 LABORATOIRE DE TESTS</h1>
    <p style="text-align: center; font-style: italic; opacity: 0.7;">Test des nouvelles fonctionnalités pour Romain</p>

    <h2><i class="fas fa-heartbeat"></i> 1. La Boîte à Mood</h2>
    <div class="section-box" style="text-align: center;">
        <p style="margin-bottom: 20px;">Comment tu te sens, mon Roms ?</p>
        <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 20px;">
            <button class="btn-gold" onclick="changeMood('gris')">Gris ☁️</button>
            <button class="btn-gold" onclick="changeMood('neutre')">Normal ⚖️</button>
            <button class="btn-gold" onclick="changeMood('deter')">Dété 🔥</button>
        </div>
        <div id="mood-response" style="padding: 20px; border: 1px dashed var(--gold-dark); border-radius: 10px; min-height: 50px; background: rgba(255,255,255,0.02);">
            <span style="opacity: 0.5;">En attente de ton mood...</span>
        </div>
    </div>

    <h2><i class="fas fa-compact-disc"></i> 2. Radio Sanctuaire</h2>
    <div class="section-box">
        <div style="aspect-ratio: 16/9; margin-bottom: 20px;">
            <iframe id="main-player" src="https://www.youtube.com/embed/fPO76Jdqk60" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;">
            <button class="btn-gold" onclick="playSong('fPO76Jdqk60')">Rocky Theme 🥊</button>
            <button class="btn-gold" onclick="playSong('fAnvD9S9HXA')">Amoureuse 🎹</button>
            <button class="btn-gold" onclick="playSong('5NPBIwQyPWE')">Synthwave Chill 🌌</button>
        </div>
    </div>

    <h2><i class="fas fa-film"></i> 3. Ciné-Club</h2>
    <div class="section-box">
        <div class="grid">
            <div class="card">
                <div style="aspect-ratio: 16/9; background: #333; display: flex; align-items: center; justify-content: center; border-radius: 10px;">
                    <i class="fas fa-play-circle" style="font-size: 3em; color: var(--gold-main);"></i>
                </div>
                <p style="margin-top: 10px; font-weight: bold; color: var(--gold-light);">Ip Man (Complet)</p>
                <button class="btn-gold" style="width: 100%; font-size: 0.8em;">LANCER</button>
            </div>
            <div class="card">
                <div style="aspect-ratio: 16/9; background: #333; display: flex; align-items: center; justify-content: center; border-radius: 10px;">
                    <i class="fas fa-play-circle" style="font-size: 3em; color: var(--gold-main);"></i>
                </div>
                <p style="margin-top: 10px; font-weight: bold; color: var(--gold-light);">The Beekeeper</p>
                <button class="btn-gold" style="width: 100%; font-size: 0.8em;">LANCER</button>
            </div>
        </div>
    </div>

</div>

<script>
    // GESTION DU MOOD
    function changeMood(etat) {
        const box = document.getElementById('mood-response');
        if(etat === 'gris') {
            box.innerHTML = "<p style='color: var(--accent-blue);'><b>Le Rocher :</b> Je sens que c'est dur gro. Écoute ça, je suis là pour toi. ❤️</p>";
            box.style.borderColor = "var(--accent-blue)";
        } else if(etat === 'neutre') {
            box.innerHTML = "<p style='color: var(--gold-light);'><b>Le Rocher :</b> On garde le cap. T'es le meilleur, oublie jamais. ⚖️</p>";
            box.style.borderColor = "var(--gold-main)";
        } else if(etat === 'deter') {
            box.innerHTML = "<p style='color: #ff3b30; font-weight: bold;'><b>Le Rocher :</b> C'EST ÇA MON ROMS ! VA TOUT PÉTER ! 🔥💪</p>";
            box.style.borderColor = "#ff3b30";
        }
    }

    // GESTION DU JUKEBOX
    function playSong(id) {
        const player = document.getElementById('main-player');
        player.src = "https://www.youtube.com/embed/" + id + "?autoplay=1";
    }
</script>

</body>
</html>
