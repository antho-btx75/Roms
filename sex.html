    <style>
        /* RESET & SÉCURITÉ AFFICHAGE */
        * { box-sizing: border-box; }
        
        :root {
            --bg-deep: #06020d;
            --hot-purple: #8957e5;
            --hot-red: #ff3b30;
            --hot-pink: #ff2d55;
            --hot-glow: rgba(137, 87, 229, 0.5);
            --dark-box: #000000;
            --text-main: #e6edf3;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* Sécurité anti-flottement */
            scroll-behavior: smooth;
        }

        /* STYLE DU HEADER IMAGE AVEC TRAIT DELUXE NÉON */
        .header-photo {
            width: 100%;
            position: relative;
            overflow: hidden;
            border-bottom: 4px solid;
            border-image: linear-gradient(90deg, var(--hot-red), var(--hot-pink), var(--hot-purple)) 1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(255, 59, 48, 0.2);
        }
        .header-photo img {
            width: 100%;
            height: auto;
            display: block;
        }
        .header-shadow {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(to bottom, transparent, rgba(6, 2, 13, 0.8));
        }

        /* NOUVEAU STYLE TEXTE NEON (MONTSERRAT 900) */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap');
        
        .hot-text-container {
            padding: 40px 20px 0px 20px; 
            text-align: center;
            background: transparent;
            overflow: hidden; /* Coupe tout dépassement dû à la pulsation */
            width: 100%;
        }

        .hot-phrase-neon {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 auto;
            margin-bottom: 5px; 
            background: linear-gradient(to bottom, #ff3b30, #ff2d55, #8957e5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(255, 45, 85, 0.8);
            display: inline-block; /* Nécessaire pour un scale propre */
            max-width: 100%;
            animation: hot-pulse 2.5s ease-in-out infinite;
        }

        @keyframes hot-pulse {
            0%, 100% { 
                transform: scale(1); 
                filter: brightness(1) blur(0px); 
                text-shadow: 0 0 15px rgba(255, 45, 85, 0.6); 
            }
            50% { 
                transform: scale(1.06); 
                filter: brightness(1.8) blur(0.5px); 
                text-shadow: 0 0 30px rgba(255, 45, 85, 1), 0 0 60px rgba(137, 87, 229, 0.8); 
            }
        }

        @media (max-width: 600px) {
            .hot-phrase-neon { 
                font-size: 1.6rem; 
            }
            .hot-text-container { padding: 30px 10px 0px 10px; }
        }

        /* BOX PRINCIPALE & CONTAINERS */
        .container { 
            width: 100%; 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px; 
        }

        #hot {
            background: var(--dark-box);
            border: 2px solid;
            border-image: linear-gradient(135deg, var(--hot-red), var(--hot-purple)) 1;
            padding: 25px;
            box-shadow: 0 15px 50px rgba(0,0,0,1), 0 0 20px rgba(137, 87, 229, 0.15);
            margin-top: 10px;
            position: relative;
            z-index: 5;
        }

        /* TITRES & BOUTONS */
        h2 {
            color: #fff;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.1em; 
            margin: 40px 0 25px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(137, 87, 229, 0.3);
            text-shadow: 0 0 10px var(--hot-glow);
        }

        .btn-glow {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: linear-gradient(135deg, var(--hot-purple), var(--hot-red));
            color: white !important;
            padding: 16px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: bold;
            margin: 15px auto;
            width: 100%;
            border: none;
            transition: 0.3s ease;
            box-shadow: 0 4px 15px rgba(137, 87, 229, 0.3);
            text-align: center;
        }

        .btn-glow:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(255, 59, 48, 0.6); }

        .video-card-glow {
            width: 100%;
            padding: 2px;
            background: linear-gradient(45deg, var(--hot-red), var(--hot-purple));
            border-radius: 16px;
            position: relative;
            margin: 25px 0;
            box-shadow: 0 0 20px rgba(137, 87, 229, 0.3);
        }

        .video-inner { background: #0d1117; border-radius: 14px; padding: 20px; text-decoration: none; display: block; color: #fff; text-align: center; font-weight: 600; }

        .badge-new { position: absolute; top: -10px; right: -10px; background: var(--hot-red); color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 0.7em; font-weight: 900; box-shadow: 0 0 15px rgba(255, 59, 48, 0.6); z-index: 10; }

        .vocal-player { width: 100%; max-width: 280px; height: 45px; border: 1px solid var(--hot-purple); border-radius: 50px; background: #000; margin: 10px auto; display: block; filter: drop-shadow(0 0 8px var(--hot-glow)); }

        .photo-library { width: 100%; border: 1px solid var(--hot-purple); border-radius: 18px; overflow: hidden; margin: 30px 0; background: rgba(0,0,0,0.5); }
        .lib-header { background: linear-gradient(to right, var(--hot-purple), #5b21b6); color: #fff; padding: 15px; text-align: center; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }
        .lib-grid { display: flex; border-top: 1px solid rgba(137, 87, 229, 0.2); }
        .lib-col { flex: 1; padding: 15px 10px; border-right: 1px solid rgba(137, 87, 229, 0.2); }
        .lib-col:last-child { border-right: none; }

        .pill-hot {
            display: block;
            padding: 10px;
            background: rgba(137, 87, 229, 0.1);
            color: #d8b4fe !important;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 8px;
            text-align: center;
            font-size: 0.85em;
            font-weight: 600;
            border: 1px solid rgba(137, 87, 229, 0.2);
            transition: 0.2s;
        }

        .pill-hot:hover { background: var(--hot-purple); color: #fff !important; }

        .intro-text { text-align: center; color: #a78bfa; font-style: italic; margin-bottom: 25px; line-height: 1.8; }
        .quote-block { text-align: center; color: #c9d1d9; font-size: 0.95em; line-height: 1.8; margin: 25px 0; }
        .final-block { border-top: 1px dashed var(--hot-purple); padding: 30px 10px; margin-top: 40px; text-align: center; background: rgba(137, 87, 229, 0.03); border-radius: 20px; }
