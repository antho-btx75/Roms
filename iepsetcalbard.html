            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: #ff2d55;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-top: 30px;
        }

        .thumb {
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #ff2d55;
            transition: all 0.3s;
        }

        .thumb:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(255, 45, 85, 0.4);
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-container {
            margin: 60px auto;
            max-width: 500px;
        }
