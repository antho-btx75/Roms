            color: #e6edf3;

            margin: 0;

            margin: 0 auto;
        }

            color: #ff2d55;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-top: 30px;
        }

        .thumb {
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #ff2d55;
            transition: all 0.3s;
        }

        .thumb:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(255, 45, 85, 0.4);
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        button {
            background: linear-gradient(90deg, #ff2d55, #c026d3);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            margin: 40px auto;
            display: block;
        }
