<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOVIE BOX - IMMERSION</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Container de l'image/GIF */
        .media-container {
            width: 100%;
            max-width: 500px;
            position: relative;
            box-shadow: 0 0 30px rgba(255, 45, 85, 0.4);
            border: 1px solid #333;
        }

        #display-media {
            width: 100%;
            display: block;
        }

        /* Lecteur Audio Custom */
        .audio-controls {
            margin-top: 30px;
            width: 80%;
            max-width: 400px;
            text-align: center;
        }

        audio {
            width: 100%;
            filter: invert(1) hue-rotate(180deg) brightness(1.5); /* Pour le rendre rose/rouge sur fond noir */
        }

        /* Texte et Bouton Retour */
        .status {
            margin-top: 20px;
            color: #ff2d55;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #555;
            text-decoration: none;
            font-size: 0.7rem;
            border: 1px solid #333;
            padding: 5px 10px;
            border-radius: 4px;
            transition: 0.3s;
        }

        .back-btn:hover {
            color: #ff2d55;
            border-color: #ff2d55;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <a href="javascript:history.back()" class="back-btn">< RETOUR</a>

    <div class="media-container">
        <img id="display-media" src="" alt="Chargement...">
    </div>

    <div class="audio-controls">
        <audio id="display-audio" controls autoplay>
            <source src="" type="audio/mpeg">
            Votre navigateur ne supporte pas l'audio.
        </audio>
    </div>

    <div class="status">Mode Immersion Gava : ON</div>

    <script>
        // Extraction des données de l'URL
        const params = new URLSearchParams(window.location.search);
        const gifUrl = params.get('gif');
        const audioUrl = params.get('audio');

        const imgElement = document.getElementById('display-media');
        const audioElement = document.getElementById('display-audio');

        // Attribution des sources
        if (gifUrl) {
            imgElement.src = decodeURIComponent(gifUrl);
        }
        if (audioUrl) {
            audioElement.querySelector('source').src = decodeURIComponent(audioUrl);
            audioElement.load(); // Recharge le lecteur avec la nouvelle source
            
            // Tentative de lecture automatique (certains navigateurs bloquent l'autoplay sans interaction)
            audioElement.play().catch(error => {
                console.log("L'autoplay nécessite un clic utilisateur préalable sur la page précédente.");
            });
        }
    </script>
</body>
    </html>
