<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIFF HOT À LA CARTE - IMMERSION</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #050108; 
            color: #fff; 
            font-family: sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; overflow: hidden; 
        }
        .back-btn { position: absolute; top: 20px; left: 20px; color: #555; text-decoration: none; font-size: 0.7rem; border: 1px solid #222; padding: 8px 15px; border-radius: 50px; z-index: 100; }
        .media-container { width: 100%; max-width: 600px; box-shadow: 0 0 50px rgba(255, 45, 85, 0.3); border-radius: 10px; overflow: hidden; background: #000; }
        
        /* Styles pour que l'image et la vidéo occupent tout l'espace */
        #display-media, #display-video { width: 100%; display: block; }
        
        .audio-controls { margin-top: 30px; width: 85%; max-width: 450px; text-align: center; }
        audio { width: 100%; filter: invert(1) hue-rotate(180deg) brightness(1.5); }
        .status { margin-top: 20px; color: #ff2d55; font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <a href="javascript:history.back()" class="back-btn">< RETOUR</a>

    <div class="media-container" id="media-holder">
        </div>

    <div class="audio-controls">
        <audio id="display-audio" controls autoplay></audio>
    </div>

    <div id="status" class="status">SESSION PRIVÉE : EN COURS</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const gifParam = params.get('gif');
        const audioParam = params.get('audio');
        const mediaHolder = document.getElementById('media-holder');

        if (gifParam) {
            const decodedMedia = decodeURIComponent(gifParam);

            // ANALYSE DU TYPE DE MÉDIA
            // Si le lien contient "ibb" c'est un GIF ImgBB
            // Si l'ID est long (vidéo Drive) ou finit par une logique vidéo
            // On va tester si c'est l'ID de ta vidéo Oral
            if (decodedMedia === "1WVaQ0weeAGJwUDiQSQoqugP140CKYnmN") {
                // MODE VIDÉO (Pour ta gâterie)
                mediaHolder.innerHTML = `
                    <video id="display-video" autoplay loop muted playsinline>
                        <source src="https://docs.google.com/uc?export=download&id=${decodedMedia}" type="video/mp4">
                    </video>`;
            } else {
                // MODE IMAGE (Pour tes GIFs Drive ou ImgBB)
                let imgSrc = decodedMedia.startsWith('http') ? decodedMedia : "https://drive.google.com/uc?export=view&id=" + decodedMedia;
                mediaHolder.innerHTML = `<img id="display-media" src="${imgSrc}">`;
            }
        }
        
        // GESTION AUDIO
        if (audioParam) {
            const audio = document.getElementById('display-audio');
            const decodedAudio = decodeURIComponent(audioParam);
            audio.src = decodedAudio.startsWith('http') ? decodedAudio : "https://docs.google.com/uc?export=open&id=" + decodedAudio;
            audio.load();
            audio.play().catch(() => {
                document.getElementById('status').innerHTML = "⚠️ CLIQUE SUR PLAY POUR LE SON";
            });
        }
    </script>
</body>
    </html>
