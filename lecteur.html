<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOVIE BOX - IMMERSION</title>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        .back-btn { position: absolute; top: 20px; left: 20px; color: #555; text-decoration: none; font-size: 0.7rem; border: 1px solid #333; padding: 5px 10px; border-radius: 4px; z-index: 10; }
        .media-container { width: 100%; max-width: 500px; box-shadow: 0 0 30px rgba(255, 45, 85, 0.4); border: 1px solid #333; }
        #display-media { width: 100%; display: block; min-height: 200px; background: #050505; }
        .audio-controls { margin-top: 30px; width: 80%; max-width: 400px; text-align: center; }
        audio { width: 100%; filter: invert(1) hue-rotate(180deg) brightness(1.5); }
        .status { margin-top: 20px; color: #ff2d55; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; animation: pulse 2s infinite; text-align: center; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <a href="javascript:history.back()" class="back-btn">< RETOUR</a>

    <div class="media-container">
        <img id="display-media" src="" alt="Chargement du visuel...">
    </div>

    <div class="audio-controls">
        <audio id="display-audio" controls autoplay preload="auto"></audio>
    </div>

    <div id="status" class="status">Mode Immersion Gava : ON</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const gifId = params.get('gif');
        const audioId = params.get('audio');

        const imgElement = document.getElementById('display-media');
        const audioElement = document.getElementById('display-audio');

        // 1. GESTION IMAGE (Le lien qui marche sur tous les navigateurs)
        if (gifId) {
            // "view" est nécessaire pour que Google Drive renvoie le type de fichier image
            imgElement.src = "https://drive.google.com/uc?export=view&id=" + gifId;
        }

        // 2. GESTION AUDIO (L'astuce Direct Content)
        if (audioId) {
            // "download" force le flux binaire, ce qui aide Chrome à lire le son
            audioElement.src = "https://drive.google.com/uc?export=download&id=" + audioId;
            audioElement.load();
            
            // Tentative d'autoplay
            let playPromise = audioElement.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    // Si le navigateur bloque l'autoplay (Chrome, Brave, Safari)
                    console.log("Autoplay bloqué");
                    document.getElementById('status').innerHTML = "⚠️ CLIQUE SUR PLAY POUR LE SON";
                    document.getElementById('status').style.color = "#fff";
                });
            }
        }
    </script>
</body>
    </html>
