<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOVIE BOX - IMMERSION</title>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .back-btn { position: absolute; top: 20px; left: 20px; color: #555; text-decoration: none; font-size: 0.7rem; border: 1px solid #333; padding: 5px 10px; border-radius: 4px; }
        .media-container { width: 100%; max-width: 500px; border: 1px solid #333; }
        #display-media { width: 100%; display: block; }
        .audio-controls { margin-top: 30px; width: 80%; max-width: 400px; }
        audio { width: 100%; filter: invert(1) hue-rotate(180deg); }
        .status { margin-top: 20px; color: #ff2d55; font-size: 0.8rem; text-align: center; }
    </style>
</head>
<body>

    <a href="javascript:history.back()" class="back-btn">< RETOUR</a>

    <div class="media-container">
        <img id="display-media" src="">
    </div>

    <div class="audio-controls">
        <audio id="display-audio" controls autoplay></audio>
    </div>

    <div id="status" class="status">MODE IMMERSION : ON</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const gifId = params.get('gif');
        const audioSrc = params.get('audio');

        // 1. IMAGE : On utilise le lien UC VIEW qui est le seul 100% stable
        if (gifId) {
            document.getElementById('display-media').src = "https://drive.google.com/uc?export=view&id=" + gifId;
        }
        
        // 2. AUDIO : On prend ce qui arrive (ID ou Lien complet) et on le met dans le lecteur
        if (audioSrc) {
            const audio = document.getElementById('display-audio');
            let url = decodeURIComponent(audioSrc);

            // Si c'est un ID Drive (pas de http), on le formate
            if (!url.includes('http')) {
                url = "https://docs.google.com/uc?export=download&id=" + url;
            }

            audio.src = url;
            audio.play().catch(e => {
                document.getElementById('status').innerHTML = "⚠️ CLIQUE SUR PLAY POUR LE SON";
            });
        }
    </script>
</body>
</html>
