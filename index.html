<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GRIS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap');

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: #0a0a0a;
            color: #e2e2e2;
            font-family: 'Plus Jakarta Sans', sans-serif;
            touch-action: none;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .title {
            font-size: 4.8rem;
            font-weight: 800;
            letter-spacing: 0.8em;
            padding-left: 0.8em; 
            text-transform: uppercase;
            background: linear-gradient(180deg, #e2e2e2 0%, #777777 50%, #333333 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 40px;
            white-space: nowrap;
            line-height: 1;
            user-select: none;
        }

        .player-container {
            width: 100%;
            max-width: 520px;
            padding: 0 20px;
            margin-bottom: 50px;
        }

        .player-container iframe {
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .question {
            font-size: 1.15rem;
            line-height: 1.6;
            text-align: center;
            max-width: 420px;
            margin-bottom: 30px;
            color: #b3b3b3;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-width: 380px;
            width: 100%;
        }

        label {
            display: flex;
            align-items: center;
            font-size: 1.1rem;
            padding: 12px 20px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        label:hover {
            background: rgba(255,255,255,0.08);
        }

        input[type="checkbox"] {
            margin-right: 14px;
            transform: scale(1.3);
        }
    </style>
</head>
<body>

    <div class="title">GRIS</div>

    <div class="player-container">
        <iframe width="100%" height="120" 
                src="https://www.youtube.com/embed/QpuZdodbjFM" 
                title="Thylacine - Saxophone" 
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen></iframe>
    </div>

    <p class="question">Souhaites-tu que la page revienne comme avant ?</p>

    <div class="choices">
        <label><input type="checkbox" onchange="sendResponse(1)"> Oui</label>
        <label><input type="checkbox" onchange="sendResponse(2)"> Non</label>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        emailjs.init({ publicKey: "5m3HlCIUn6OkqDYMy" });

        function sendResponse(choice) {
            const text = choice === 1 ? "Oui" : "Non";
            emailjs.send("service_quyacff", "template_vekw5ae", {
                to_email: "ryo.saeba75012@outlook.fr",
                message: "Réponse à la question GRIS : " + text,
                date: new Date().toLocaleString('fr-FR')
            });
        }
    </script>

</body>
</html>
