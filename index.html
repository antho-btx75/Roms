<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRIS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #e2e2e2;
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .title {
            font-size: 4.8rem;
            font-weight: 800;
            letter-spacing: 0.8em;
            /* L'astuce est ici : on compense l'espace de la dernière lettre */
            padding-left: 0.8em; 
            text-transform: uppercase;
            background: linear-gradient(180deg, #e2e2e2 0%, #777777 50%, #333333 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 60px;
            white-space: nowrap;
            line-height: 1;
        }

        .player-container {
            width: 100%;
            max-width: 520px;
            padding: 0 20px;
            box-sizing: border-box; /* Évite les problèmes de largeur avec le padding */
        }

        .player-container iframe {
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            display: block; /* Supprime les espaces résiduels sous l'iframe */
        }
    </style>
</head>
<body>

    <div class="title">GRIS</div>

    <div class="player-container">
        <iframe width="100%" height="120" 
                src="https://www.youtube.com/embed/QpuZdodbjFM" 
                title="Thylacine - Saxophone" 
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen></iframe>
    </div>

</body>
</html>
