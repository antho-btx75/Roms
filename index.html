<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Message</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #030305;
            color: #f0f0f5;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Canvas dynamique pour le fond */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            filter: blur(40px);
            opacity: 0.85;
        }

        /* Header fixe */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 16px;
            background: linear-gradient(180deg, rgba(3, 3, 5, 0.92) 0%, rgba(3, 3, 5, 0.5) 80%, rgba(3, 3, 5, 0) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .header-image {
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 1px rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .header-image img {
            width: 100%;
            height: auto;
            max-height: 22vh;
            object-fit: cover;
            display: block;
            filter: brightness(0.9) contrast(1.05);
        }

        /* Conteneur principal */
        main {
            width: 100%;
            max-width: 480px;
            padding: 0 20px 60px 20px;
            margin-top: calc(22vh + 40px);
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* Boîte du message */
        .status-message-box-v2 {
            width: 100%;
            background: rgba(14, 14, 20, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 24px 22px;
            color: #e6e6f0;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.65;
            letter-spacing: 0.01em;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            text-align: left;
            position: relative;
            word-wrap: break-word;
        }

        .status-prompt-v2 {
            display: inline-block;
            color: #ffd700;
            font-weight: 700;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 1.1rem;
            margin-right: 10px;
            vertical-align: baseline;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            animation: pulsePromptV2 2s infinite ease-in-out;
        }

        .typewriter-text-v2 {
            display: inline;
        }

        .typewriter-cursor-v2 {
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: #ffd700;
            margin-left: 4px;
            vertical-align: middle;
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
            animation: blinkCursorV2 0.8s infinite;
        }

        /* Lecteur Vidéo au format PORTRAIT / SMARTPHONE (9:16) */
        .video-container {
            width: 100%;
            max-width: 400px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s ease;
            pointer-events: none;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 215, 0, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
            padding-bottom: 177.78%; /* Ratio 9:16 parfait pour écran vertical */
            height: 0;
            margin: 0 auto;
        }

        .video-container.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        @keyframes pulsePromptV2 {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); text-shadow: 0 0 14px rgba(255, 215, 0, 0.8); }
        }

        @keyframes blinkCursorV2 {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @media (max-height: 667px) {
            .header-image img {
                max-height: 18vh;
            }
            main {
                margin-top: calc(18vh + 35px);
            }
            .status-message-box-v2 {
                font-size: 0.95rem;
                padding: 18px 18px;
            }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <header>
        <div class="header-image">
            <img src="https://i.ibb.co/qMPSKTWL/Polish-20260719-000105817.png" alt="Header">
        </div>
    </header>

    <main>
        <div class="status-message-box-v2">
            <span class="status-prompt-v2">&gt;</span><span class="typewriter-text-v2" id="tw-text-v2"></span><span class="typewriter-cursor-v2" id="cursor"></span>
        </div>

        <div class="video-container" id="video-player">
            <iframe src="https://player.vimeo.com/video/1212471047?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" 
                    allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media" 
                    title="Vidéo">
            </iframe>
        </div>
    </main>

    <script>
        // --- Animation du Fond Mouvant ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const blobs = [
            { x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: 250, vx: 0.8, vy: 0.6, color: 'rgba(110, 45, 220, 0.35)' },
            { x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: 300, vx: -0.6, vy: 0.7, color: 'rgba(215, 40, 100, 0.25)' },
            { x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: 220, vx: 0.5, vy: -0.8, color: 'rgba(30, 80, 180, 0.3)' },
            { x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: 280, vx: -0.7, vy: -0.5, color: 'rgba(150, 20, 90, 0.2)' }
        ];

        function animateBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            blobs.forEach(b => {
                b.x += b.vx;
                b.y += b.vy;

                if (b.x < -100 || b.x > canvas.width + 100) b.vx *= -1;
                if (b.y < -100 || b.y > canvas.height + 100) b.vy *= -1;

                const gradient = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
                gradient.addColorStop(0, b.color);
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(animateBg);
        }
        animateBg();

        // --- Machine à Écrire + Apparition du Lecteur ---
        (function() {
            const message = "Je te sens gris... Encore plus que d'habitude. Et ça me rend gris mon Romain... Stp, dis moi les raisons. Y'a le taff, ça je le sais. Mais y a autre chose, et stp, ne me dis pas \"les gens\", c'est trop vague.\n\nDonne moi les vraies raisons qui te rendent aussi gris. C'est moi? C'est un autre gars? C'est Kevin ? C'est un peu tout ça ?\n\nJe te kiffe trop et ça me tue de cogiter sur tout ça frère. Qui te fait câbler ?";
            
            const speed = 35;
            const textContainer = document.getElementById("tw-text-v2");
            const videoPlayer = document.getElementById("video-player");
            
            if (!textContainer) return;

            const characters = Array.from(message);
            let index = 0;

            function typeWriter() {
                if (index < characters.length) {
                    if (characters[index] === '\n') {
                        textContainer.appendChild(document.createElement('br'));
                    } else {
                        textContainer.appendChild(document.createTextNode(characters[index]));
                    }
                    index++;
                    setTimeout(typeWriter, speed);
                } else {
                    setTimeout(() => {
                        videoPlayer.classList.add('show');
                    }, 400);
                }
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", () => setTimeout(typeWriter, 500));
            } else {
                setTimeout(typeWriter, 500);
            }
        })();
    </script>

</body>
</html>
