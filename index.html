<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRIS</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #0a0a0a;
            color: #e2e2e2;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        .top-text {
            font-size: 1.25rem;
            color: #ff79c6;
            text-align: center;
            margin: 30px 0 15px 0;
            padding: 0 20px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        img {
            max-width: 100%;
            max-height: 65%;
            object-fit: contain;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            margin-bottom: 20px;
        }
        .bottom-text {
            font-size: 1.15rem;
            color: #777777;
            text-align: center;
            padding: 0 25px;
            font-style: italic;
            line-height: 1.6;
        }
        .final-note {
            font-size: 1.1rem;
            color: #ff79c6;
            text-align: center;
            margin-top: 40px;
            padding: 0 25px;
            font-weight: 500;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <p class="top-text">Je n'ai toujours été qu'un second choix dans ta vie</p>
    
    <img src="https://i.ibb.co/B5Hptknp/Polish-20260719-000105817.png" alt="GRIS">

    <p class="bottom-text">Quelqu'un que l'on peut facilement ignorer....</p>

    <p class="final-note">
        Je me retire définitivement de ta vie.<br>
        Mais sache que je t'aimerai toujours.
    </p>

</body>
</html>
