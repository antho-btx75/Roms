<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MORT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0a;
            color: #e2e2e2;
            font-family: 'Plus Jakarta Sans', sans-serif;
            position: fixed;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .title {
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: 0.65em;
            text-transform: uppercase;
            background: linear-gradient(180deg, #e2e2e2 0%, #555555 50%, #1a1a1a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 40px;
            white-space: nowrap;
            line-height: 1;
        }

        .subtitle {
            font-size: 1.12rem;
            line-height: 1.75;
            max-width: 520px;
            text-align: center;
            color: #777777;
            font-weight: 400;
            padding: 0 25px;
            margin-bottom: 50px;
        }

        .player-container {
            width: 100%;
            max-width: 520px;
            padding: 0 20px;
        }

        .player-container iframe {
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div class="title">MORT</div>
    <p class="subtitle">
        J'aurais aussi aimé t'inviter à dormir chez moi.<br>
        Je voulais juste t'aimer mon gars. Même maladroitement, même avec excès. Je demandais juste à t'aimer.<br><br>
        Jean Ferrat disait : "Heureux celui qui meurt d'aimer." Ce soir je meurs donc heureux.<br><br>
        Adieu. Et encore pardon... mon gars...
    </p>

    <div class="player-container">
        <iframe width="100%" height="120" 
                src="https://www.youtube.com/embed/U8ehlSXBHPE" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
        </iframe>
    </div>

</body>
</html>
