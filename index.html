<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Un jour peut-être, mon gars...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #08080a;
            --card-bg: rgba(22, 22, 28, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-color: #a78bfa; /* Violet doux et moderne */
            --accent-glow: rgba(167, 139, 250, 0.35);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(167, 139, 250, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.03) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .player-card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 
                0 30px 60px -12px rgba(0, 0, 0, 0.5),
                0 18px 36px -18px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Cover Image */
        .header-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .header-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .player-card:hover .header-image img {
            transform: scale(1.02);
        }

        /* Title */
        .title {
            font-size: 1.1rem;
            color: var(--text-sub);
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.2px;
            font-style: italic;
        }

        /* Custom Audio Player Controls */
        .audio-player {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Timeline / Progress Bar */
        .timeline-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            padding: 4px 0;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            position: relative;
            overflow: visible;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-color);
            border-radius: 10px;
            position: relative;
            box-shadow: 0 0 12px var(--accent-glow);
            transition: width 0.1s linear;
        }

        /* Handle/Thumb */
        .progress-bar-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s ease;
        }

        .timeline-container:hover .progress-bar-fill::after {
            transform: translateY(-50%) scale(1);
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        /* Controls Row */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 4px;
        }

        .btn {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn:hover {
            color: var(--text-main);
            transform: scale(1.08);
        }

        .btn-play {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--accent-color);
            color: #08080a;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .btn-play:hover {
            transform: scale(1.05);
            background: #b89fff;
            color: #08080a;
        }

        .btn-play svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            margin-left: 2px; /* Center play icon visually */
        }

        .btn-play.playing svg {
            margin-left: 0;
        }

        .btn-skip svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <!-- Visual / Image -->
        <div class="header-image">
            <img src="https://i.ibb.co/qMPSKTWL/Polish-20260719-000105817.png" alt="GRIS">
        </div>

        <!-- Title -->
        <p class="title">« Un jour peut-être, mon gars... »</p>

        <!-- Custom Player -->
        <div class="audio-player">
            <audio id="audio-element" preload="metadata">
                <source src="https://audio.jukehost.co.uk/019f954e-3bc7-727b-9298-08d31d7b0995" type="audio/mpeg">
                Votre navigateur ne supporte pas l'audio.
            </audio>

            <!-- Timeline -->
            <div class="timeline-container" id="timeline">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
                <div class="time-stamps">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="btn btn-skip" id="rewind-btn" title="-10s">
                    <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
                </button>

                <button class="btn btn-play" id="play-btn" title="Lecture">
                    <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>

                <button class="btn btn-skip" id="forward-btn" title="+10s">
                    <svg viewBox="0 0 24 24"><path d="M11.5 8c2.65 0 5.05.99 6.9 2.6L22 7v9h-9l3.62-3.62c-1.39-1.16-3.16-1.88-5.12-1.88-3.54 0-6.55 2.31-7.6 5.5l-2.37-.78C2.92 11.03 6.85 8 11.5 8z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('audio-element');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const timeline = document.getElementById('timeline');
        const progressFill = document.getElementById('progress-fill');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const rewindBtn = document.getElementById('rewind-btn');
        const forwardBtn = document.getElementById('forward-btn');

        // SVG Icons
        const playSvg = '<path d="M8 5v14l11-7z"/>';
        const pauseSvg = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

        // Play / Pause Toggle
        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        });

        audio.addEventListener('play', () => {
            playIcon.innerHTML = pauseSvg;
            playBtn.classList.add('playing');
        });

        audio.addEventListener('pause', () => {
            playIcon.innerHTML = playSvg;
            playBtn.classList.remove('playing');
        });

        // Format Seconds to MM:SS
        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // Set Duration metadata
        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
        });

        // Update Progress Bar
        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;
            const progress = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = `${progress}%`;
            currentTimeEl.textContent = formatTime(audio.currentTime);
        });

        // Seek Audio
        function setAudioProgress(e) {
            const rect = timeline.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            const percentage = Math.max(0, Math.min(1, clickX / width));
            
            if (audio.duration) {
                audio.currentTime = percentage * audio.duration;
            }
        }

        let isDragging = false;
        timeline.addEventListener('mousedown', (e) => {
            isDragging = true;
            setAudioProgress(e);
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) setAudioProgress(e);
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Touch support for mobile
        timeline.addEventListener('touchstart', (e) => {
            setAudioProgress(e.touches[0]);
        }, { passive: true });

        timeline.addEventListener('touchmove', (e) => {
            setAudioProgress(e.touches[0]);
        }, { passive: true });

        // Skip buttons (-10s / +10s)
        rewindBtn.addEventListener('click', () => {
            audio.currentTime = Math.max(0, audio.currentTime - 10);
        });

        forwardBtn.addEventListener('click', () => {
            audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
        });
    </script>
</body>
</html>
