<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Un jour peut-être, mon gars...</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            background: #0a0a0a;
            color: #e2e2e2;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .header-image {
            width: 100%;
            max-width: 480px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            margin-bottom: 40px;
        }

        .header-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .title {
            font-size: 1.25rem;
            color: #c9c9c9;
            text-align: center;
            margin-bottom: 25px;
            font-weight: 500;
            letter-spacing: 0.3px;
            font-style: italic;
        }

        .audio-box {
            width: 100%;
            max-width: 420px;
            background: rgba(20, 20, 20, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 18px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        audio {
            width: 100%;
            height: 40px;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="header-image">
        <img src="https://i.ibb.co/qMPSKTWL/Polish-20260719-000105817.png" alt="GRIS">
    </div>

    <p class="title">Un jour peut-être, mon gars...</p>

    <div class="audio-box">
        <audio controls>
            <source src="https://audio.jukehost.co.uk/019f954e-3bc7-727b-9298-08d31d7b0995" type="audio/mpeg">
            Votre navigateur ne supporte pas l'audio.
        </audio>
    </div>

</body>
</html>
