<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RLAB Studio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #050507;
    background-image: 
      radial-gradient(circle at 20% 30%, rgba(120, 80, 200, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(80, 140, 220, 0.06) 0%, transparent 45%);
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .header-gif {
    width: 100%;
    max-height: 200px;
    object-fit: cover;
    display: block;
    filter: brightness(0.85) contrast(1.05);
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }
  .title-block {
    text-align: center;
    margin: 20px 0 24px;
    padding: 0 20px;
  }
  h1 {
    color: #fcf6ba;
    font-size: 1.8rem;
    letter-spacing: 3px;
    font-weight: 700;
    text-shadow: 0 0 20px rgba(252, 246, 186, 0.25);
  }
  .subtitle {
    color: #bc8cff;
    font-size: 0.88rem;
    margin-top: 6px;
    letter-spacing: 1.5px;
    font-weight: 500;
    opacity: 0.85;
  }
  .carousel-wrapper {
    width: 100%;
    overflow-x: auto;
    padding: 8px 0 40px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .carousel-wrapper::-webkit-scrollbar { display: none; }
  .carousel {
    display: flex;
    gap: 14px;
    padding: 0 16px;
    width: max-content;
    align-items: stretch;
  }
  .clip-item {
    flex: 0 0 260px;
    height: 340px;
    background: rgba(16, 18, 28, 0.75);
    border: 1px solid rgba(188, 140, 255, 0.18);
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.25s ease;
    box-shadow: 0 4px 18px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .clip-item:hover {
    transform: translateY(-4px);
    border-color: rgba(252, 246, 186, 0.45);
  }
  .thumb {
    position: relative;
    flex: 1;
    min-height: 200px;
    background-size: cover;
    background-position: center;
    background-color: #000;
  }
  .play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 54px;
    height: 54px;
    background: rgba(0,0,0,0.65);
    border: 1.5px solid rgba(252, 246, 186, 0.75);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fcf6ba;
    font-size: 1.3rem;
    backdrop-filter: blur(4px);
  }
  .clip-label {
    padding: 12px 14px 14px;
    text-align: center;
    font-weight: 600;
    color: #f0e6d2;
    font-size: 0.88rem;
    letter-spacing: 0.2px;
  }
  .version {
    display: block;
    font-size: 0.72rem;
    color: #bc8cff;
    font-weight: 500;
    margin-top: 3px;
    letter-spacing: 0.5px;
  }
  .clip-player {
    position: absolute;
    inset: 0;
    background: #000;
    display: none;
    z-index: 2;
  }
  .clip-player iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  .clip-item.playing .clip-player {
    display: block;
  }
  .clip-item.playing .thumb,
  .clip-item.playing .clip-label {
    visibility: hidden;
  }
</style>
</head>
<body>

<img class="header-gif" src="https://i.ibb.co/8443rZj1/ezgif-1d5e6284f922fe74.gif" alt="Header">

<div class="title-block">
  <h1>RLAB Studio</h1>
  <p class="subtitle">Du kiff pour les oreilles</p>
</div>

<div class="carousel-wrapper">
  <div class="carousel">
    <div class="clip-item" data-id="EL9S4Q8x6k0">
      <div class="thumb" style="background-image: url('https://i.ytimg.com/vi/EL9S4Q8x6k0/hqdefault.jpg');">
        <div class="play-btn">▶</div>
      </div>
      <p class="clip-label">Après le taff<span class="version">v1</span></p>
      <div class="clip-player"></div>
    </div>

    <div class="clip-item" data-id="0uiXbnndtdU">
      <div class="thumb" style="background-image: url('https://i.ytimg.com/vi/0uiXbnndtdU/hqdefault.jpg');">
        <div class="play-btn">▶</div>
      </div>
      <p class="clip-label">Après le taff<span class="version">v2</span></p>
      <div class="clip-player"></div>
    </div>

    <div class="clip-item" data-id="fY6YFZj4ig8">
      <div class="thumb" style="background-image: url('https://i.ytimg.com/vi/fY6YFZj4ig8/hqdefault.jpg');">
        <div class="play-btn">▶</div>
      </div>
      <p class="clip-label">C'est déjà ça</p>
      <div class="clip-player"></div>
    </div>

    <div class="clip-item" data-id="6baRDQzA_aA">
      <div class="thumb" style="background-image: url('https://i.ytimg.com/vi/6baRDQzA_aA/hqdefault.jpg');">
        <div class="play-btn">▶</div>
      </div>
      <p class="clip-label">C'est déjà ça<span class="version">v1</span></p>
      <div class="clip-player"></div>
    </div>

    <div class="clip-item" data-id="CasiGudtTlw">
      <div class="thumb" style="background-image: url('https://i.ytimg.com/vi/CasiGudtTlw/hqdefault.jpg');">
        <div class="play-btn">▶</div>
      </div>
      <p class="clip-label">C'est déjà ça, gava<span class="version">v2</span></p>
      <div class="clip-player"></div>
    </div>

    <div class="clip-item" data-id="4P-LNiMJbPA">
      <div class="thumb" style="background-image: url('https://i.ytimg.com/vi/4P-LNiMJbPA/hqdefault.jpg');">
        <div class="play-btn">▶</div>
      </div>
      <p class="clip-label">C'est déjà ça<span class="version">v3</span></p>
      <div class="clip-player"></div>
    </div>

    <div class="clip-item" data-id="wpu3iteXJp0">
      <div class="thumb" style="background-image: url('https://i.ytimg.com/vi/wpu3iteXJp0/hqdefault.jpg');">
        <div class="play-btn">▶</div>
      </div>
      <p class="clip-label">Je t'entends mon gars</p>
      <div class="clip-player"></div>
    </div>

    <div class="clip-item" data-id="veDZq-So6Xg">
      <div class="thumb" style="background-image: url('https://i.ytimg.com/vi/veDZq-So6Xg/hqdefault.jpg');">
        <div class="play-btn">▶</div>
      </div>
      <p class="clip-label">On se parle sans se dire</p>
      <div class="clip-player"></div>
    </div>
  </div>
</div>

<script>
  document.querySelectorAll('.clip-item').forEach(item => {
    item.addEventListener('click', () => {
      // Stop any other playing clip
      document.querySelectorAll('.clip-item.playing').forEach(el => {
        if (el !== item) {
          el.classList.remove('playing');
          el.querySelector('.clip-player').innerHTML = '';
        }
      });

      if (item.classList.contains('playing')) return;

      const id = item.dataset.id;
      const player = item.querySelector('.clip-player');
      player.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
      item.classList.add('playing');
    });
  });
</script>

</body>
</html>
