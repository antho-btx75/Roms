<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RLAB Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #050507;
    background-image: 
      radial-gradient(circle at 20% 30%, rgba(120, 80, 200, 0.1) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(80, 140, 220, 0.08) 0%, transparent 45%);
    color: #e6edf3;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .header-gif {
    width: 100%;
    max-height: 200px;
    object-fit: cover;
    display: block;
    filter: brightness(0.82) contrast(1.08) saturate(1.1);
    box-shadow: 0 10px 50px rgba(0,0,0,0.7);
  }
  .title-block {
    text-align: center;
    margin: 28px 0 36px;
    padding: 0 20px;
    position: relative;
  }
  .title-block::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 280px;
    height: 90px;
    background: radial-gradient(circle, rgba(252, 246, 186, 0.12) 0%, transparent 70%);
    filter: blur(20px);
    z-index: 0;
    pointer-events: none;
  }
  h1 {
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
    font-size: 2.5rem;
    letter-spacing: 4px;
    background: linear-gradient(135deg, #fcf6ba 0%, #fff5d6 40%, #bf953f 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 30px rgba(252, 246, 186, 0.15);
    position: relative;
    z-index: 1;
    margin-bottom: 8px;
  }
  .subtitle {
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
    font-size: 1.05rem;
    letter-spacing: 2.5px;
    color: #c4b5fd;
    opacity: 0.9;
    text-transform: uppercase;
    position: relative;
    z-index: 1;
    text-shadow: 0 0 12px rgba(196, 181, 253, 0.25);
  }
  .carousel-wrapper {
    width: 100%;
    overflow-x: auto;
    padding: 8px 0 40px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .carousel-wrapper::-webkit-scrollbar { display: none; }
  .carousel {
    display: flex;
    gap: 14px;
    padding: 0 16px;
    width: max-content;
    align-items: stretch;
  }
  .clip-item {
    flex: 0 0 260px;
    height: 340px;
    background: rgba(16, 18, 28, 0.75);
    border: 1px solid rgba(188, 140, 255, 0.18);
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.25s ease;
    box-shadow: 0 4px 18px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .clip-item:hover {
    transform: translateY(-4px);
    border-color: rgba(252, 246, 186, 0.45);
  }
  .thumb {
    position: relative;
    flex: 1;
    min-height: 200px;
    background-size: cover;
    background-position: center;
    background-color: #000;
  }
  .play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 54px;
    height: 54px;
    background: rgba(0,0,0,0.65);
    border: 1.5px solid rgba(252, 246, 186, 0.75);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fcf6ba;
    font-size: 1.3rem;
    backdrop-filter: blur(4px);
  }
  .clip-label {
    padding: 12px 14px 14px;
    text-align: center;
    font-weight: 600;
    color: #f0e6d2;
    font-size: 0.88rem;
    letter-spacing: 0.2px;
  }
  .version {
    display: block;
    font-size: 0.72rem;
    color: #bc8cff;
    font-weight: 500;
    margin-top: 3px;
    letter-spacing: 0.5px;
  }
  .clip-player {
    position: absolute;
    inset: 0;
    background: #000;
    display: none;
    z-index: 2;
  }
  .clip-player iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  .clip-item.playing .clip-player {
    display: block;
  }
  .clip-item.playing .thumb,
  .clip-item.playing .clip-label {
    visibility: hidden;
  }
  .back-card {
    flex: 0 0 260px;
    height: 340px;
    background: linear-gradient(145deg, rgba(16, 18, 28, 0.9), rgba(30, 20, 40, 0.85));
    border: 1px solid rgba(252, 246, 186, 0.3);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #fcf6ba;
    box-shadow: 0 4px 18px rgba(0,0,0,0.45), inset 0 0 40px rgba(252, 246, 186, 0.04);
    transition: all 0.25s ease;
    padding: 20px;
  }
  .back-card:hover {
    transform: translateY(-4px);
    border-color: rgba(252, 246, 186, 0.6);
    box-shadow: 0 10px 32px rgba(252, 246, 186, 0.15);
  }
  .back-card .arrow {
    font-size: 2.2rem;
    margin-bottom: 14px;
    opacity: 0.9;
  }
  .back-card .back-text {
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
    font-size: 1.05rem;
    letter-spacing: 1px;
    text-align: center;
    line-height: 1.4;
  }
</style>
</head>

<script>
  emailjs.init({ publicKey: "5m3HlCIUn6OkqDYMy" });

  const isMe = new URLSearchParams(window.location.search).has('moi');

      date: new Date().toLocaleString('fr-FR')
    }).then(() => {
      console.log("Notification RLAB Studio envoyée");
    }).catch(err => console.log("Erreur:", err));
  }

  document.querySelectorAll('.clip-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.clip-item.playing').forEach(el => {
        if (el !== item) {
          el.classList.remove('playing');
          el.querySelector('.clip-player').innerHTML = '';
        }
      });

      if (item.classList.contains('playing')) return;

      const id = item.dataset.id;
      const player = item.querySelector('.clip-player');
      player.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
      item.classList.add('playing');
    });
  });
</script>
