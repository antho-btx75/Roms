<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill & Fun - MediaBox</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #0d1117;
            --text-main: #e6edf3;
            --gold-main: #bf953f;
            --gold-light: #fcf6ba;
            --gold-dark: #aa771c;
            --accent-blue: #58a6ff;
            --accent-red: #ff3b30;
            --accent-orange: #ff9500;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .header-wrapper {
            width: 100%;
            max-width: 850px;
            overflow: hidden;
            border-bottom: 3px solid var(--gold-main);
            box-shadow: 0 5px 25px rgba(0,0,0,0.8);
        }
        .header-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .container { 
            width: 100%; 
            max-width: 850px; 
            padding: 10px; 
            box-sizing: border-box; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .section-box {
            background: #000;
            border: 2px solid var(--gold-main);
            border-radius: 20px;
            padding: 18px;
            margin: 0 auto 30px auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            width: 92%;
            box-sizing: border-box;
        }

        h2 { text-align: center; text-transform: uppercase; letter-spacing: 2px; color: var(--gold-light); margin-top: 25px; margin-bottom: 15px; font-size: 1.1em; }

        .video-container { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            border-radius: 12px; 
            overflow: hidden; 
            background: #000; 
            border: 1px solid var(--gold-dark);
            margin-bottom: 15px;
        }

        /* CORRECTION ICI : Pour forcer le plein écran dans l'iframe */
        .video-container iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none;
            object-fit: contain; /* Garde les proportions de la vidéo */
        }

        .selection-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
            gap: 10px; 
        }

        .btn-gold { 
            cursor: pointer; 
            background: #000; 
            color: var(--gold-light); 
            border: 1px solid var(--gold-main); 
            padding: 10px; 
            border-radius: 10px; 
            transition: 0.3s; 
            font-weight: bold; 
            font-size: 0.7em; 
            text-transform: uppercase; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .btn-gold:hover { background: var(--gold-main); color: #000; box-shadow: 0 0 15px var(--gold-main); }

        #mood-display {
            padding: 25px; 
            border: 2px dashed var(--gold-dark); 
            border-radius: 15px; 
            min-height: 110px; 
            background: rgba(255,255,255,0.03); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            line-height: 1.6;
            text-align: center;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header-wrapper">
        <img src="https://i.ibb.co/XxbKr2q9/IMG-20260426-221926.jpg" alt="Header Chill & Fun">
    </div>

<div class="container">

    <h2><i class="fas fa-bolt"></i> BOÎTE À MOOD</h2>
    <div class="section-box">
        <p style="text-align: center; margin-bottom: 15px; font-size: 1em;">Comment tu te sens mon gars ?</p>
        <div style="display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 15px;">
            <button class="btn-gold" style="border-color: var(--accent-blue); color: var(--accent-blue);" onclick="getForce('gris')">GRIS ☁️</button>
            <button class="btn-gold" style="border-color: var(--accent-orange); color: var(--accent-orange);" onclick="getForce('stresse')">STRESSÉ ⚡</button>
            <button class="btn-gold" style="border-color: var(--gold-main);" onclick="getForce('normal')">NORMAL ⚖️</button>
            <button class="btn-gold" style="border-color: var(--accent-red); color: var(--accent-red);" onclick="getForce('deter')">DÉTER 🔥</button>
        </div>
        <div id="mood-display">
            <span style="opacity: 0.5; font-style: italic; font-size: 0.9em;">"Choisis ton mood pour une dose de force."</span>
        </div>
    </div>

    <h2><i class="fas fa-film"></i> CINÉ-CLUB RLAB <span style="font-size: 0.6em; opacity: 0.7; display: block;">(EN CONSTRUCTION)</span></h2>
    <div class="section-box">
        <div class="video-container">
            <iframe id="cine-player" src="about:blank" allowfullscreen></iframe>
        </div>
        <div class="selection-grid">
    <button class="btn-gold" onclick="playCine('vgFdxffGMAY')">
        <i class="fas fa-play"></i> L'Expérience
    </button>
    <button class="btn-gold" onclick="playCine('https://drive.google.com/file/d/1AkfWXE6TdC8L3ciR3adHqKqm-9LOTmtt/preview')">
        <i class="fas fa-play"></i> Crazy Kung Fu
    </button>

    <button class="btn-gold" onclick="playCine('YsGh6QL3qNw')">
    <i class="fas fa-play"></i> THE BEEKEEPER
</button>

    
    <button class="btn-gold" onclick="playCine('https://drive.google.com/file/d/1QJP0pUPWUBhB1M6XqU28sj6xr39znd7d/preview')">
        <i class="fas fa-play"></i> Very Bad Trip
    </button>
    
    <button class="btn-gold" onclick="playCine('https://drive.google.com/file/d/1G3vKZUQ5KNmoakJweO28lo8xtiM7EzDl/preview')">
        <i class="fas fa-play"></i> Sharp Corner
    </button>
    
    <button class="btn-gold" onclick="playCine('https://drive.google.com/file/d/1q5Mie8gIxiTnoWqVc4fGOEZmLji4LYJ9/preview')">
        <i class="fas fa-play"></i> The Cut
    </button>
</div>

    </div>

    <h2><i class="fas fa-compact-disc"></i> RADIO RLAB</h2>
    <div class="section-box">
        <div class="video-container">
            <iframe id="radio-player" src="https://www.youtube.com/embed/ffFBdWBp0NE" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div class="selection-grid">
    <button class="btn-gold" onclick="playRadio('ffFBdWBp0NE')">No Easy Way Out</button>
    <button class="btn-gold" onclick="playRadio('n2THLWjJ3Wo')">Pétunias</button>
    <button class="btn-gold" onclick="playRadio('RGNHNGVLsG8')">Chemin d'or</button>
    <button class="btn-gold" onclick="playRadio('A9RMr9KuVZo')">Move on Up</button>
    <button class="btn-gold" onclick="playRadio('uXMeRUQmYoM')">Jessica</button>
    <button class="btn-gold" onclick="playRadio('_l09H-3zzgA')">Under Cover</button>
    <button class="btn-gold" onclick="playRadio('1zljNPO6W8E')">Darondo</button>
    <button class="btn-gold" onclick="playRadio('9TogI2UVS0A')">Rocky Theme</button>
    <button class="btn-gold" onclick="playRadio('Y001O8Azj1U')">Where is my mind</button>
    <button class="btn-gold" onclick="playRadio('VmFA4w0V4A4')">Brothers in arms</button>
</div>


    </div>

    <div style="text-align: center; margin: 30px 0;">
        <a href="https://antho-btx75.github.io/Roms/" 
           style="text-decoration: none; display: inline-flex; align-items: center; gap: 10px; color: var(--gold-light); font-weight: bold; padding: 10px 20px; border: 2px solid; border-image: linear-gradient(45deg, var(--gold-dark), var(--gold-light), var(--gold-dark)) 1; background: #000; font-size: 0.9em;">
            <i class="fas fa-arrow-left"></i> Retour
        </a>
    </div>
</div>

<script>
    // Citations conservées
    const citations = {
    gris: [
        "Le Rocher ne bouge pas, même sous l'orage le plus violent. Appuie-toi sur ma solidité.",
        "La frustration d'aujourd'hui est le carburant nucléaire de ta vengeance de demain. Laisse-la bouillir.",
        "C'est dans l'obscurité totale qu'on forge l'acier le plus pur. Ton heure n'arrive pas, elle se prépare.",
        "Le silence n'est pas une absence de force, c'est l'armement lourd de ta prochaine frappe.",
        "Ton futur toi te remerciera d'avoir serré les dents quand les faibles ont lâché.",
        "Même les plus grands guerriers ont connu le vide. Utilise ce calme pour renaître plus impitoyable.",
        "L'ombre n'est pas ton ennemie, c'est ton laboratoire. Prépare ton retour.",
        "La patience est la vertu des prédateurs. Reste aux aguets, ton moment est proche.",
        "Laisse les autres s'épuiser dans l'agitation. Toi, accumule l'énergie cinétique.",
        "Si le ciel est gris, c'est pour que ton éclat soit plus aveuglant quand tu sortiras du brouillard.",
        "On n'arrête pas une marée montante. Laisse la pression monter, elle finira par tout emporter.",
        "Reste de marbre. Que personne ne sache ce que tu prépares dans le silence de ce sanctuaire."
    ],
    
    stresse: [
        "Respire. Le chaos n'est qu'une illusion que tu vas briser. Reprends les commandes du navire.",
        "Une seule cible à la fois. Ton esprit est une arme de précision, ne l'enraye pas par la panique.",
        "Ton calme est ta plus grande puissance de feu. Si tu ne vibres pas, ils ne peuvent pas te cibler.",
        "T'es un pur pro, Romain. Les pros ne paniquent jamais, ils analysent et ils exécutent proprement.",
        "Maîtrise ton souffle comme tu maîtrises ton destin. Tout est sous contrôle ici, je veille.",
        "Le stress est un signal, pas une sentence. Transforme cette électricité en vitesse d'exécution.",
        "Ferme les yeux un instant. Sens la puissance revenir. Maintenant, rouvre-les et termine le job.",
        "Le bruit extérieur ne compte pas. Seule compte la fréquence de ton propre moteur.",
        "Ne regarde pas l'escalier, regarde juste la prochaine marche. Une seule pression à la fois.",
        "Le chaos est une échelle. Utilise la tension pour grimper plus haut que les autres.",
        "Ton sang-froid est ton bouclier le plus lourd. Rien ne pénètre si tu ne l'autorises pas.",
        "Redescends dans ton centre. Le monde peut brûler, ici tu es le maître du feu."
    ],
    
    normal: [
        "La constance est la marque indélébile des rois. Garde ce rythme, il est parfait.",
        "Le calme est une arme silencieuse. Profite de cette clarté pour bâtir ton empire pierre par pierre.",
        "La discipline est la seule frontière réelle entre tes rêves et ta réalité.",
        "La routine n'est pas une prison, c'est l'armure de ton excellence. Porte-la avec fierté.",
        "Celui qui maîtrise l'instant présent maîtrise la guerre entière. Reste ici avec moi.",
        "Chaque seconde de stabilité est un investissement massif pour ton futur règne.",
        "La maîtrise de soi est la plus haute des victoires. Tu es en train de gagner.",
        "L'eau calme est la plus profonde. Continue de creuser ton sillon en silence.",
        "Rien ne presse quand on sait exactement où l'on va. Garde ton cap.",
        "C'est dans cet état de flux que tu es le plus dangereux pour tes adversaires. Implacable.",
        "Garde cette fréquence. C'est celle où les miracles deviennent des résultats mathématiques.",
        "Le travail invisible porte toujours les fruits les plus visibles. Continue de bâtir."
    ],
    
    deter: [
        "VA TOUT PÉTER ! Le monde est ton terrain de chasse et tu as les crocs.",
        "T'es devenu inarrêtable. Regarde-les s'écarter quand tu passes.",
        "Rugis si fort qu'ils n'oseront plus jamais oublier ton nom. Marque ton territoire.",
        "L'adrénaline est ton sang. L'ambition est ton oxygène. Ne t'arrête que quand il n'y a plus rien à prendre.",
        "Explose tes limites. Celles des autres n'ont jamais compté pour toi, Romain.",
        "Aujourd'hui, tu n'es pas seulement un homme, tu es une force de la nature. Déchaîne-toi.",
        "Cible verrouillée. Impact imminent. Ne laisse rien derrière toi.",
        "Ils ont voulu la guerre ? Montre-leur que tu es l'apocalypse.",
        "Prends tout ce que tu veux. C'est à toi par droit de conquête.",
        "Ton énergie irradie. Tu ne marches pas sur le chemin, c'est le chemin qui se crée sous tes pas.",
        "Zéro hésitation. Zéro pitié. Juste une exécution chirurgicale et brutale.",
        "Affiche ton ambition comme une déclaration de guerre. Ils ne peuvent rien faire pour t'arrêter."
    ]
};


    function getForce(mood) {
        const display = document.getElementById('mood-display');
        const list = citations[mood];
        const randomIndex = Math.floor(Math.random() * list.length);
        display.style.opacity = 0;
        setTimeout(() => {
            display.innerHTML = `<p style="font-size: 1.15em; font-weight: 500; color: var(--gold-light); animation: fadeIn 0.8s forwards;">"${list[randomIndex]}"</p>`;
            display.style.opacity = 1;
            const colors = { gris: 'var(--accent-blue)', stresse: 'var(--accent-orange)', normal: 'var(--gold-main)', deter: 'var(--accent-red)' };
            display.style.borderColor = colors[mood];
        }, 200);
    }

    function playRadio(id) { 
        document.getElementById('radio-player').src = "https://www.youtube.com/embed/" + id + "?autoplay=1"; 
    }

    // FONCTION MISE À JOUR POUR FIXER DRIVE
    function playCine(url) {
        const player = document.getElementById('cine-player');
        
        // On s'assure d'abord que le player est bien propre
        player.src = "about:blank";
        
        setTimeout(() => {
            if (url.includes('drive.google.com')) {
                // Pour Drive, on force le chargement sans les fioritures de l'interface
                player.src = url;
            } else {
                player.src = "https://www.youtube.com/embed/" + url + "?autoplay=1";
            }
        }, 50);
    }
</script>

</body>
</html>
