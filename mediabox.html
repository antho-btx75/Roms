<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill & Fun - MediaBox</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #0d1117;
            --text-main: #e6edf3;
            --gold-main: #bf953f;
            --gold-light: #fcf6ba;
            --gold-dark: #aa771c;
            --accent-blue: #58a6ff;
            --accent-red: #ff3b30;
            --accent-orange: #ff9500;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 850px; padding: 20px; box-sizing: border-box; }
        
        .section-box {
            background: #000;
            border: 2px solid var(--gold-main);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            width: 100%;
        }

        h2 { text-align: center; text-transform: uppercase; letter-spacing: 3px; color: var(--gold-light); margin-top: 30px; margin-bottom: 20px; }

        /* LECTEUR UNIFIÉ */
        .video-container { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            border-radius: 12px; 
            overflow: hidden; 
            background: #000; 
            border: 1px solid var(--gold-dark);
            margin-bottom: 20px;
        }
        .video-container iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:none; }

        /* GRILLES DE BOUTONS */
        .selection-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 12px; 
        }

        /* BOUTONS GOLD */
        .btn-gold { 
            cursor: pointer; 
            background: #000; 
            color: var(--gold-light); 
            border: 1px solid var(--gold-main); 
            padding: 12px; 
            border-radius: 10px; 
            transition: 0.3s; 
            font-weight: bold; 
            font-size: 0.8em; 
            text-transform: uppercase; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-gold:hover { background: var(--gold-main); color: #000; box-shadow: 0 0 15px var(--gold-main); transform: translateY(-2px); }

        #mood-display {
            padding: 30px; 
            border: 2px dashed var(--gold-dark); 
            border-radius: 15px; 
            min-height: 120px; 
            background: rgba(255,255,255,0.03); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            line-height: 1.6;
            text-align: center;
            transition: 0.3s;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div style="width: 100%; overflow: hidden; border-bottom: 3px solid var(--gold-main); box-shadow: 0 5px 25px rgba(0,0,0,0.8);">
        <img src="https://i.ibb.co/XxbKr2q9/IMG-20260426-221926.jpg" alt="Header Chill & Fun" style="width: 100%; height: auto; display: block; object-fit: cover;">
    </div>

<div class="container">

    <h2><i class="fas fa-bolt"></i> BOÎTE À MOOD</h2>
    <div class="section-box">
        <p style="text-align: center; margin-bottom: 25px; font-size: 1.1em; color: var(--text-main);">Comment tu te sens mon gars ?</p>
        <div style="display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-bottom: 25px;">
            <button class="btn-gold" style="border-color: var(--accent-blue); color: var(--accent-blue);" onclick="getForce('gris')">GRIS ☁️</button>
            <button class="btn-gold" style="border-color: var(--accent-orange); color: var(--accent-orange);" onclick="getForce('stresse')">STRESSÉ ⚡</button>
            <button class="btn-gold" style="border-color: var(--gold-main);" onclick="getForce('normal')">NORMAL ⚖️</button>
            <button class="btn-gold" style="border-color: var(--accent-red); color: var(--accent-red);" onclick="getForce('deter')">DÉTER 🔥</button>
        </div>
        <div id="mood-display">
            <span style="opacity: 0.5; font-style: italic;">"Sélectionne ton état et découvre une pensée inspirante"</span>
        </div>
    </div>

    <h2><i class="fas fa-film"></i> CINÉ-CLUB RLAB</h2>
    <div class="section-box">
        <div class="video-container">
            <iframe id="cine-player" src="https://www.youtube.com/embed/ffFBdWBp0NE" allowfullscreen></iframe>
        </div>
        <div class="selection-grid">
            <button class="btn-gold" onclick="playCine('ffFBdWBp0NE')"><i class="fas fa-play"></i> The Beekeeper</button>
            <button class="btn-gold" onclick="playCine('n2THLWjJ3Wo')"><i class="fas fa-play"></i> The Professional</button>
            <button class="btn-gold" onclick="playCine('RGNHNGVLsG8')"><i class="fas fa-play"></i> John Wick Scene</button>
            <button class="btn-gold" onclick="playCine('MR6FXpaECY8')"><i class="fas fa-play"></i> Rocky IV Training</button>
        </div>
    </div>

    <h2><i class="fas fa-compact-disc"></i> RADIO RLAB</h2>
    <div class="section-box">
        <div class="video-container">
            <iframe id="radio-player" src="https://www.youtube.com/embed/uXMeRUQmYoM" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div class="selection-grid">
            <button class="btn-gold" onclick="playRadio('ffFBdWBp0NE')">No Easy Way Out</button>
            <button class="btn-gold" onclick="playRadio('n2THLWjJ3Wo')">Pétunias</button>
            <button class="btn-gold" onclick="playRadio('RGNHNGVLsG8')">Chemin d'or</button>
            <button class="btn-gold" onclick="playRadio('A9RMr9KuVZo')">Move on Up</button>
            <button class="btn-gold" onclick="playRadio('uXMeRUQmYoM')">Jessica</button>
            <button class="btn-gold" onclick="playRadio('_l09H-3zzgA')">Under Cover</button>
            <button class="btn-gold" onclick="playRadio('1zljNPO6W8E')">Darondo</button>
            <button class="btn-gold" onclick="playRadio('MR6FXpaECY8')">Rocky Theme</button>
        </div>
    </div>

    <div style="text-align: center; margin: 50px 0 20px 0;">
        <a href="https://antho-btx75.github.io/Roms/" 
           style="text-decoration: none; display: inline-flex; align-items: center; gap: 10px; color: var(--gold-light); font-weight: bold; text-transform: uppercase; letter-spacing: 2px; padding: 15px 30px; border: 2px solid; border-image: linear-gradient(45deg, var(--gold-dark), var(--gold-light), var(--gold-dark)) 1; background: #000; transition: 0.3s;">
            <i class="fas fa-arrow-left"></i> Retour au Sanctuaire
        </a>
    </div>
</div>

<script>
    const citations = {
        gris: [
            "Le Rocher ne bouge pas, même sous l'orage. Appuie-toi sur moi.",
            "La frustration d'aujourd'hui est le carburant de ta vengeance de demain.",
            "T'es une légende en pause. Recharge et reviens tout péter.",
            "Même les plus grands guerriers ont connu le silence. Utilise-le pour renaître.",
            "On ne voit les étoiles que quand il fait nuit noire. Brille.",
            "Ton futur toi te remerciera de n'avoir pas lâché aujourd'hui.",
            "Laisse la tempête passer, tu es le phare qui reste debout.",
            "La tristesse n'est qu'un nuage, tu es le ciel tout entier.",
            "Le succès, c'est d'aller d'échec en échec sans perdre son enthousiasme."
        ],
        stresse: [
            "Respire. Le chaos n'est qu'une illusion. Reprends les commandes.",
            "Une chose à la fois. Ton esprit est une arme de précision.",
            "Ton calme est ta plus grande puissance de feu.",
            "T'es un pro. Les pros ne paniquent pas, ils exécutent.",
            "L'urgence est une émotion, pas une réalité. Analyse et agis.",
            "Maîtrise ton souffle, tu maîtriseras ton destin.",
            "Ne cours pas après le temps, impose-lui ton rythme.",
            "Vide ton esprit, soit informe comme l'eau.",
            "Le stress est un moteur, ne le laisse pas devenir un frein."
        ],
        normal: [
            "La constance est la marque des rois. Garde ce rythme.",
            "Le calme est une arme. Profite de cette clarté pour bâtir ton empire.",
            "Chaque journée 'normale' est une brique de plus pour ton avenir.",
            "La discipline est la différence entre le rêve et la réalité.",
            "La routine est l'armure de l'excellence. Ne lâche rien.",
            "Savoure la stabilité, c'est le socle de tes prochaines victoires.",
            "Reste focus. La force tranquille bat toujours l'agitation stérile.",
            "La persévérance est un talent silencieux qui mène au sommet."
        ],
        deter: [
            "VA TOUT PÉTER ! Aujourd'hui le monde tremble devant toi.",
            "T'es inarrêtable. Rien, absolument rien, ne peut te ralentir.",
            "C'est ton moment. Prends tout, ne laisse rien aux autres.",
            "Montre-leur de quel bois on se chauffe. T'es un pur guerrier.",
            "La victoire n'est pas une option, c'est ton état naturel.",
            "Écrase les obstacles comme s'ils n'existaient pas.",
            "Fais du bruit avec tes résultats, pas avec tes paroles.",
            "Rien ne résiste à une volonté de fer comme la tienne.",
            "Aujourd'hui, tu écris l'histoire. Fais en sorte qu'elle soit légendaire."
        ]
    };

    function getForce(mood) {
        const display = document.getElementById('mood-display');
        const list = citations[mood];
        const randomIndex = Math.floor(Math.random() * list.length);
        display.style.opacity = 0;
        setTimeout(() => {
            display.innerHTML = `<p style="font-size: 1.2em; font-weight: 500; color: var(--gold-light); animation: fadeIn 0.8s forwards;">"${list[randomIndex]}"</p>`;
            display.style.opacity = 1;
            const colors = { gris: 'var(--accent-blue)', stresse: 'var(--accent-orange)', normal: 'var(--gold-main)', deter: 'var(--accent-red)' };
            display.style.borderColor = colors[mood];
        }, 200);
    }

    function playRadio(id) { 
        document.getElementById('radio-player').src = "https://www.youtube.com/embed/" + id + "?autoplay=1"; 
    }

    function playCine(id) { 
        document.getElementById('cine-player').src = "https://www.youtube.com/embed/" + id + "?autoplay=1"; 
    }
</script>

</body>
</html>
