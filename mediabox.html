<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill & Fun - MediaBox</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #0d1117;
            --text-main: #e6edf3;
            --gold-main: #bf953f;
            --gold-light: #fcf6ba;
            --gold-dark: #aa771c;
            --accent-blue: #58a6ff;
            --accent-red: #ff3b30;
            --accent-orange: #ff9500;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .header-wrapper {
            width: 100%;
            max-width: 850px;
            overflow: hidden;
            border-bottom: 3px solid var(--gold-main);
            box-shadow: 0 5px 25px rgba(0,0,0,0.8);
        }
        .header-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .container { 
            width: 100%; 
            max-width: 850px; 
            padding: 10px; 
            box-sizing: border-box; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .section-box {
            background: #000;
            border: 2px solid var(--gold-main);
            border-radius: 20px;
            padding: 18px;
            margin: 0 auto 30px auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            width: 92%;
            box-sizing: border-box;
        }

        h2 { text-align: center; text-transform: uppercase; letter-spacing: 2px; color: var(--gold-light); margin-top: 25px; margin-bottom: 15px; font-size: 1.1em; }

        .video-container { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            border-radius: 12px; 
            overflow: hidden; 
            background: #000; 
            border: 1px solid var(--gold-dark);
            margin-bottom: 15px;
        }

        /* CORRECTION ICI : Pour forcer le plein écran dans l'iframe */
        .video-container iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none;
            object-fit: contain; /* Garde les proportions de la vidéo */
        }

        .selection-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
            gap: 10px; 
        }

        .btn-gold { 
            cursor: pointer; 
            background: #000; 
            color: var(--gold-light); 
            border: 1px solid var(--gold-main); 
            padding: 10px; 
            border-radius: 10px; 
            transition: 0.3s; 
            font-weight: bold; 
            font-size: 0.7em; 
            text-transform: uppercase; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .btn-gold:hover { background: var(--gold-main); color: #000; box-shadow: 0 0 15px var(--gold-main); }

        #mood-display {
            padding: 25px; 
            border: 2px dashed var(--gold-dark); 
            border-radius: 15px; 
            min-height: 110px; 
            background: rgba(255,255,255,0.03); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            line-height: 1.6;
            text-align: center;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header-wrapper">

    function getForce(mood) {
        const display = document.getElementById('mood-display');
        const list = citations[mood];
        const randomIndex = Math.floor(Math.random() * list.length);
        display.style.opacity = 0;
        setTimeout(() => {
            display.innerHTML = `<p style="font-size: 1.15em; font-weight: 500; color: var(--gold-light); animation: fadeIn 0.8s forwards;">"${list[randomIndex]}"</p>`;
            display.style.opacity = 1;
            const colors = { gris: 'var(--accent-blue)', stresse: 'var(--accent-orange)', normal: 'var(--gold-main)', deter: 'var(--accent-red)' };
            display.style.borderColor = colors[mood];
        }, 200);
    }

    function playRadio(id) { 
        document.getElementById('radio-player').src = "https://www.youtube.com/embed/" + id + "?autoplay=1"; 
    }

    // FONCTION MISE À JOUR POUR FIXER DRIVE
    function playCine(url) {
        const player = document.getElementById('cine-player');
        
        // On s'assure d'abord que le player est bien propre
        player.src = "about:blank";
        
        setTimeout(() => {
            if (url.includes('drive.google.com')) {
                // Pour Drive, on force le chargement sans les fioritures de l'interface
                player.src = url;
            } else {
                player.src = "https://www.youtube.com/embed/" + url + "?autoplay=1";
            }
        }, 50);
    }
