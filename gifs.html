<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GIFS DE BAISE ⚡🔥</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
            background: #05030a;
            color: #f0e6ff;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            min-height: 100vh;
        }

        body {
            padding: 18px 12px 50px;
            background: 
                radial-gradient(ellipse at 20% 0%, rgba(137, 87, 229, 0.18) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(255, 45, 85, 0.12) 0%, transparent 50%),
                #05030a;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #ff2d55;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 1px;
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 45, 85, 0.25);
            background: rgba(255, 45, 85, 0.06);
            transition: all 0.25s ease;
            margin: 10px 0 18px 6px;
        }

        .back-btn:hover {
            background: rgba(255, 45, 85, 0.15);
            box-shadow: 0 0 18px rgba(255, 45, 85, 0.25);
        }

        .gallery-container {
            max-width: 640px;
            margin: 0 auto 30px;
            background: linear-gradient(160deg, rgba(45, 0, 40, 0.85) 0%, rgba(12, 0, 20, 0.95) 100%);
            border: 1px solid rgba(255, 45, 85, 0.22);
            border-radius: 24px;
            padding: 28px 18px 24px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.7),
                0 0 40px rgba(137, 87, 229, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .gallery-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 45, 85, 0.5), transparent);
        }

        .gallery-title {
            text-align: center;
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff2d55, #ff00ff, #8957e5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            text-shadow: 0 0 30px rgba(255, 45, 85, 0.3);
        }

        .gallery-subtitle {
            text-align: center;
            font-size: 0.78rem;
            color: #bc8cff;
            opacity: 0.85;
            letter-spacing: 1.2px;
            margin-bottom: 26px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .gif-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 11px;
        }

        .gif-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 45, 85, 0.18);
            background: #0a0510;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gif-item:hover {
            transform: scale(1.06) translateY(-3px);
            border-color: #ff00ff;
            box-shadow: 0 12px 28px rgba(255, 0, 255, 0.35);
            z-index: 5;
        }

        .gif-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .gif-item:hover img {
            transform: scale(1.08);
        }

        .gif-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(20, 0, 30, 0.85) 0%, transparent 50%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            opacity: 0;
            transition: opacity 0.25s ease;
            font-size: 0.7rem;
            font-weight: 700;
            color: #ff2d55;
            letter-spacing: 1px;
        }

        .gif-item:hover .gif-overlay {
            opacity: 1;
        }

        /* LIGHTBOX */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(3, 1, 8, 0.97);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(8px);
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-content img {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
            box-shadow: 0 0 60px rgba(255, 0, 255, 0.2);
        }

        .close-btn {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 45, 85, 0.15);
            border: 1px solid rgba(255, 45, 85, 0.4);
            color: #ff2d55;
            font-size: 1.6rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 45, 85, 0.3);
            transform: scale(1.1);
        }

        /* Flèches très discrètes */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.45);
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            opacity: 0.5;
            transition: all 0.25s ease;
        }

        .nav-btn:hover {
            opacity: 1;
            background: rgba(255, 45, 85, 0.25);
            border-color: #ff2d55;
            color: #fff;
        }

        .prev { left: 12px; }
        .next { right: 12px; }

        @media (max-width: 420px) {
            .gif-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .gallery-title {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>

    <a href="https://antho-btx75.github.io/Roms/sex" class="back-btn">

        let currentIndex = 0;
        const grid = document.getElementById('gifGrid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        gifs.forEach((src, i) => {
            const div = document.createElement('div');
            div.className = 'gif-item';
            div.innerHTML = `
                <img src="${src}" alt="GIF ${i+1}" loading="lazy">
                <div class="gif-overlay">MATER 🔥</div>
            `;
            div.onclick = () => openLightbox(i);
            grid.appendChild(div);
        });

        function openLightbox(index) {
            currentIndex = index;
            lightboxImg.src = gifs[currentIndex];
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        function changeGif(dir) {
            currentIndex = (currentIndex + dir + gifs.length) % gifs.length;
            lightboxImg.src = gifs[currentIndex];
        }

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') changeGif(-1);
            if (e.key === 'ArrowRight') changeGif(1);
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });
